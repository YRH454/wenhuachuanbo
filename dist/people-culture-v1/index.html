<!-- PEOPLE-CULTURE-v1
THESIS: 真实人物与本城四项文化并置，不把不同城市混成一座城，也不以生成画代替真人肖像。
OWN-WORLD: 继承用户认可的 interaction-preview-v1：暖灰纸面、墨绿宋体、细线、姓名页签与横展屏风。
STORY: 选择城市，认识有出处的人，展开本城文化对象，再读介绍与资料来源。
FIRST VIEWPORT: 顶部返回与选城；紧凑导语后接大幅人物/姓名介绍，四物屏风在下一段自然展开。
FORM: 用户已指定样板结构，不抽签、不生成新的构图方案；十六城独立读取内部草稿，未齐资料明确回退。
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
-->

  <header class="site-header">
    <a class="brand" href="../?variant=A#/map">一物见山东</a>
